// Project-level build.gradle — TANPA repositories di sini
// karena sudah didefinisikan di settings.gradle (dependencyResolutionManagement)

rootProject.buildDir = "../build"

subprojects { subproject ->
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(":app")

    // --- PATCH: injeksi namespace untuk library yang belum set (contoh: devicelocale) ---
    if (subproject.name.contains("devicelocale")) {
        subproject.plugins.withId("com.android.library") {
            subproject.android {
                // bebas isi namespace unik (tidak harus real package)
                namespace "com.patched.devicelocale"
            }
        }
    }
}

// task clean
tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
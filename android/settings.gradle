pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }

    // Path Flutter SDK dari local.properties
    def flutterSdkPath = {
        def p = new Properties()
        file("local.properties").withInputStream { p.load(it) }
        def path = p.getProperty("flutter.sdk")
        assert path != null : "flutter.sdk not set in local.properties"
        return path
    }
    settings.ext.flutterSdkPath = flutterSdkPath()

    // Hubungkan ke Flutter gradle (pakai SDK, cocok untuk FVM juga)
    includeBuild("${settings.ext.flutterSdkPath}/packages/flutter_tools/gradle")
}

plugins {
    // Loader plugin Flutter (HARUS ada, jangan apply di sini)
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"

    // Versi plugin *dideklarasikan* di sini, apply-nya nanti di app/build.gradle
    id "com.android.application" version "8.7.2" apply false
    id "org.jetbrains.kotlin.android" version "2.1.0" apply false
    id "com.google.gms.google-services" version "4.4.2" apply false
}

// dependencyResolutionManagement {
//     repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
//     repositories {
//         google()
//         mavenCentral()
//     }

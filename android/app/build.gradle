plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    // Plugin flutter deklaratif (ini menggantikan apply-from lama)
    id "dev.flutter.flutter-gradle-plugin"
    // Firebase/Google services (kalau dipakai)
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

android {
    namespace "com.masjid_app"

    compileSdk 36
    // jika kamu ingin 35 dan semua lib support: compileSdk 35

    defaultConfig {
        applicationId "com.masjid_app"
        minSdk flutter.minSdkVersion
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        multiDexEnabled true
        manifestPlaceholders["foregroundServiceType"] = "mediaPlayback"
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    ndkVersion flutter.ndkVersion

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    signingConfigs {
        release {
            def keystoreProperties = new Properties()
            def keystorePropertiesFile = rootProject.file("key.properties")
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
            }
            keyAlias keystoreProperties["keyAlias"]
            keyPassword keystoreProperties["keyPassword"]
            storeFile keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
            storePassword keystoreProperties["storePassword"]
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            // opsional debug configs
        }
    }

    packaging {
    jniLibs {
      // WAJIB: matikan legacy packaging (yang meng-kompres .so)
      useLegacyPackaging = false
    }
  }
}

flutter {
    source "../.."
}

dependencies {
    // desugaring JDK libs
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"

    // contoh window libs (biarkan kalau diperlukan)
    implementation "androidx.window:window:1.3.0"
    implementation "androidx.window:window-java:1.3.0"

    // Firebase BoM (silakan sesuaikan versi jika perlu)
    implementation platform("com.google.firebase:firebase-bom:33.2.0")
    // Tambahkan modul firebase yang kamu butuhkan, contoh:
    // implementation "com.google.firebase:firebase-analytics-ktx"
    // implementation "com.google.android.play:core:1.10.3"
}
